<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#0A0D12"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="1200" height="48" fill="#121620" stroke="#1E2433"/>
  <circle cx="28" cy="24" r="6" fill="#EF4444"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="24" r="6" fill="#10B981"/>
  <rect x="120" y="12" width="400" height="24" rx="4" fill="#0B0D12" stroke="#252D3D"/>
  <text x="140" y="28" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">android-studio-emulator / Pixel 8 Pro / PetAdoptApp</text>

  <!-- Phone Frames Side-by-Side -->
  <!-- Screen 1: Home Feed -->
  <g transform="translate(180, 80)">
    <rect width="360" height="620" rx="36" fill="#141822" stroke="#2B3547" stroke-width="4"/>
    <!-- Speaker & Camera -->
    <rect x="130" y="14" width="100" height="18" rx="9" fill="#0B0D12"/>
    <circle cx="180" cy="23" r="5" fill="#1E293B"/>

    <!-- App Header -->
    <text x="30" y="70" fill="#F5F5F7" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold">Find a Friend</text>
    <text x="30" y="92" fill="#8A94A6" font-family="-apple-system, sans-serif" font-size="12">Adopt pets near Cikarang</text>

    <!-- Category Tabs -->
    <rect x="30" y="110" width="70" height="30" rx="15" fill="#E6C4CF"/>
    <text x="50" y="130" fill="#0B0D12" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">All</text>
    <rect x="110" y="110" width="70" height="30" rx="15" fill="#1E2433"/>
    <text x="132" y="130" fill="#F5F5F7" font-family="-apple-system, sans-serif" font-size="11">Dogs</text>
    <rect x="190" y="110" width="70" height="30" rx="15" fill="#1E2433"/>
    <text x="214" y="130" fill="#F5F5F7" font-family="-apple-system, sans-serif" font-size="11">Cats</text>

    <!-- Pet Card 1 -->
    <rect x="30" y="160" width="300" height="200" rx="16" fill="#1B2130" stroke="#2D374D"/>
    <rect x="30" y="160" width="300" height="130" rx="16" fill="#252F44"/>
    <circle cx="180" cy="225" r="35" fill="#E6C4CF" fill-opacity="0.2"/>
    <text x="50" y="320" fill="#F5F5F7" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">Mochi · Golden Retriever</text>
    <text x="50" y="342" fill="#8A94A6" font-family="-apple-system, sans-serif" font-size="11">2 Months · Vaccinated · Male</text>

    <!-- Pet Card 2 -->
    <rect x="30" y="380" width="300" height="200" rx="16" fill="#1B2130" stroke="#2D374D"/>
    <rect x="30" y="380" width="300" height="130" rx="16" fill="#2A3245"/>
    <text x="50" y="540" fill="#F5F5F7" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">Luna · British Shorthair</text>
    <text x="50" y="562" fill="#8A94A6" font-family="-apple-system, sans-serif" font-size="11">4 Months · Spayed · Female</text>
  </g>

  <!-- Screen 2: Pet Details & Adoption Form -->
  <g transform="translate(660, 80)">
    <rect width="360" height="620" rx="36" fill="#141822" stroke="#2B3547" stroke-width="4"/>
    <rect x="130" y="14" width="100" height="18" rx="9" fill="#0B0D12"/>

    <!-- Hero Image Area -->
    <rect x="20" y="45" width="320" height="220" rx="24" fill="#241B2A"/>
    <circle cx="180" cy="155" r="50" fill="#E6C4CF" fill-opacity="0.3"/>

    <!-- Details Card -->
    <text x="30" y="300" fill="#F5F5F7" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold">Mochi</text>
    <text x="30" y="325" fill="#E6C4CF" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">President Shelter Partner #04</text>

    <text x="30" y="365" fill="#8A94A6" font-family="-apple-system, sans-serif" font-size="12" line-height="1.5">
      Mochi is energetic, affectionate, and great with students. Looking for a caring home with open space.
    </text>

    <!-- Health Badges -->
    <rect x="30" y="420" width="140" height="40" rx="8" fill="#1B2130"/>
    <text x="45" y="445" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">✓ Fully Vaccinated</text>

    <rect x="190" y="420" width="140" height="40" rx="8" fill="#1B2130"/>
    <text x="210" y="445" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">✓ Microchipped</text>

    <!-- CTA Button -->
    <rect x="30" y="520" width="300" height="50" rx="12" fill="#E6C4CF"/>
    <text x="180" y="552" fill="#0B0D12" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Submit Adoption Request</text>
  </g>
</svg>
